[project]
name = "oil_crises_analysis_2026"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15.2"
authors = [{ name = "DragonBishop", email = "276789280+DragonBishop@users.noreply.github.com" }]
license = "MIT"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "ipykernel>=7.4.0",
]
dynamic = ["version"]

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "nbwipers>=0.7.2",
  "prek>=0.5.10",
]
lint = [
  "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.report]
exclude_also = [
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  'class .*\bProtocol\):',
  '@(abc\.)?abstractmethod',
]

[tool.hatch.version]
path = "src/oil_crises_analysis_2026/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/oil_crises_analysis_2026"]

[tool.hatch.build.targets.sdist]
exclude = [
  "*.ipynb",
  ".venv",
  "uv.lock",
]

[tool.nbwipers]
strip-kernel-info = true

[tool.rumdl]
disable = ["MD013"]
exclude = ["CHANGELOG.md"]

[tool.rumdl.MD024]
siblings-only = true

[tool.uv]
# 7-day supply-chain cooldown, first in tool.uv for Semgrep
exclude-newer = "7 days"
default-groups = ["dev"]
